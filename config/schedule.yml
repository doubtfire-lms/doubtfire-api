# config/schedule.yml

register_webhooks:
  cron: "every day at 5"
  class: "TiiRegisterWebHookJob"
  queue: parallel

progress_turn_it_in_jobs:
  cron: "every 30 minutes"
  class: "TiiCheckProgressJob"
  queue: parallel

clean_up_auth_tokens:
  cron: "every 30 minutes"
  class: "ClearAccessTokensJob"
  queue: parallel

refresh_moderation_feedback_timestamps:
  cron: "every 60 minutes"
  class: "RefreshModerationFeedbackTimestampsJob"
  queue: parallel

aggregate_task_completion_stats:
  cron: "every day at 11:55pm"
  class: "AggregateTaskCompletionStatsJob"
  queue: parallel

poll_communication_set_schedules:
  cron: "every 5 minutes"
  class: "PollCommunicationSetSchedulesJob"
  queue: parallel

notify_discuss_timeout:
  cron: "every day at 8am"
  class: "NotifyDiscussTimeoutJob"
  queue: parallel

notify_task_deadlines:
  cron: "every hour"
  class: "NotifyTaskDeadlinesJob"

notify_feedback_warnings:
  cron: "every hour"
  class: "NotifyFeedbackWarningsJob"

poll_notification_digests:
  cron: "every 5 minutes"
  class: "PollNotificationDigestsJob"

prune_notifications:
  cron: "every day at 2am"
  class: "PruneNotificationsJob"

sync_lms_integrations:
  cron: "every day at 3am"
  class: "SyncLmsIntegrationsJob"
  queue: parallel

